[project]
name = "glass-drive-ui"
version = "0.1.0"
description = "Minimal unified operator UI for Glass Hive"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.139,<1.0",
  "httpx>=0.28.1,<1.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn>=0.51,<1.0",
  "websockets>=16,<17",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
